# http-level settings for the Hermes web UI (managed by deploy/provision.sh)
# server_tokens is enforced in nginx.conf by provision.sh (a second definition is fatal)

limit_req_zone $binary_remote_addr zone=hw_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hw_general:10m rate=20r/s;
limit_req_status 429;

# Requests for any other host name are dropped without a response.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
