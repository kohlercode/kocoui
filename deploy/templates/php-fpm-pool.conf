; Hermes web UI pool (managed by deploy/provision.sh)
[__APP_USER__]
user = __APP_USER__
group = __APP_USER__

listen = /run/php/__APP_USER__.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 30s
pm.max_requests = 500

; a turn with tools can run for minutes (SSE streams hold a worker for their whole life)
request_terminate_timeout = 900s
security.limit_extensions = .php
clear_env = yes

php_admin_value[open_basedir] = __APP_ROOT__:__FILES_ROOT__:__SOUL_PATH__
php_admin_value[sys_temp_dir] = __APP_ROOT__/var/tmp
php_admin_value[upload_tmp_dir] = __APP_ROOT__/var/tmp
php_admin_flag[file_uploads] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,putenv,show_source,highlight_file,phpinfo,posix_kill,posix_setuid,posix_setgid,posix_mkfifo,link,symlink
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = __APP_ROOT__/var/log/php-error.log
php_admin_value[max_execution_time] = 900
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = __UPLOAD_MAX__M

php_admin_value[session.save_path] = __APP_ROOT__/var/sessions
php_admin_value[session.name] = __Host-hwsid
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.cookie_path] = /
php_admin_value[session.gc_maxlifetime] = 43200
