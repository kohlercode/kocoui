# Agent work directory. Only reachable through PHP's X-Accel-Redirect after its path checks.
# Anything the agent wrote is untrusted: sandboxed, never sniffed.
location ^~ /_work/ {
    internal;
    alias __WORK_ROOT__/;
    types { }
    default_type application/octet-stream;
    include /etc/nginx/snippets/hermesweb-headers-base.conf;
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
    add_header Cache-Control "private, max-age=3600" always;
}

# PDFs: browsers refuse to render them in a sandboxed document. SAMEORIGIN (not the
# DENY from the shared headers) lets this site embed the file. Other sites cannot.
location ^~ /_work_pdf/ {
    internal;
    alias __WORK_ROOT__/;
    types { }
    default_type application/pdf;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cache-Control "private, max-age=3600" always;
}
