# Hermes web UI jails (managed by deploy/provision.sh)
[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 5
findtime = 10m
bantime  = 1h

[nginx-limit-req]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 10
findtime = 10m
bantime  = 1h

[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 10m
bantime  = 6h

[hermesweb-login]
enabled  = true
port     = http,https
filter   = hermesweb-login
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 15m
bantime  = 6h
