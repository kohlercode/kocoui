# __DOMAIN__ - Hermes web UI (managed by deploy/provision.sh)
#
# nginx must never proxy_pass to the Hermes API server. PHP is its only client.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hw_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root __APP_ROOT__/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/hermesweb/__DOMAIN__.htpasswd;

    limit_req zone=hw_general burst=60 nodelay;

    include /etc/nginx/snippets/hermesweb-headers.conf;

    location ~ /\. {
        deny all;
    }

    location ^~ /assets/ {
        location ~ /\. {
            deny all;
        }
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /api/auth/login {
        limit_req zone=hw_login burst=5 nodelay;
        include /etc/nginx/snippets/hermesweb-php.conf;
    }

    location = /api/uploads {
        client_max_body_size __UPLOAD_MAX__m;
        client_body_buffer_size 1m;
        include /etc/nginx/snippets/hermesweb-php.conf;
    }

    # Shared files, only reachable through PHP's X-Accel-Redirect after its path checks.
    # Anything the agent wrote is untrusted: sandboxed, never sniffed.
    location ^~ /_files/ {
        internal;
        alias __FILES_ROOT__/;
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/hermesweb-headers-base.conf;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    # PDFs: browsers refuse to render them in a sandboxed document; the viewer is isolated anyway.
    location ^~ /_files_pdf/ {
        internal;
        alias __FILES_ROOT__/;
        types { }
        default_type application/pdf;
        include /etc/nginx/snippets/hermesweb-headers-base.conf;
        add_header Cache-Control "private, max-age=3600" always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include /etc/nginx/snippets/hermesweb-php.conf;
    }

    location ~ \.php$ {
        return 404;
    }
}
