name: demo

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'demo/**'
      - 'app/public/sounds/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.demo.config.js'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build demo
        env:
          DEMO_BASE: ${{ vars.DEMO_BASE }}
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
