name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    # ubuntu-24.04 ships PHP 8.3. PHP 8.4 packages start with Ubuntu 25.04, so
    # they are not on this runner. Sodium is part of php8.3-common, not a
    # separate php8.3-sodium package.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use PHP 8.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-curl \
            php8.3-mbstring php8.3-sqlite3 php8.3-gd
          sudo update-alternatives --set php /usr/bin/php8.3
          php -v
          php -m | grep -qx sodium
      - name: Lint
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The manifest must exist
        run: test -f app/public/assets/.vite/manifest.json
