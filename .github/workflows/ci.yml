name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Use PHP ${{ matrix.php }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php${{ matrix.php }}-cli php${{ matrix.php }}-curl \
            php${{ matrix.php }}-mbstring php${{ matrix.php }}-sqlite3 php${{ matrix.php }}-gd \
            php${{ matrix.php }}-sodium
          sudo update-alternatives --set php /usr/bin/php${{ matrix.php }}
          php -v
      - name: Lint
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The manifest must exist
        run: test -f app/public/assets/.vite/manifest.json
